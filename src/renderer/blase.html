<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Julia – Blase</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    canvas { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: block; }
    body.greifbar canvas { cursor: grab; }
    body.zieht canvas { cursor: grabbing; }

    /* Untertitel: was du sagst, darunter die Antwort. */
    /* Direkt unter der Kugel; das Fenster wächst mit dem Text (blase:hoehe).
       Reicht der Platz bis zum Bildschirmrand nicht, scrollt es mit. */
    #untertitel {
      position: absolute;
      top: 0;
      left: 6px;
      right: 6px;
      max-height: calc(100vh - 4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding-bottom: 4px;
      overflow-y: auto;
      pointer-events: none;
      scrollbar-width: none;
      transition: opacity 0.6s ease;
    }
    #untertitel::-webkit-scrollbar { display: none; }
    #untertitel.weg { opacity: 0; }
    .zeile {
      flex: none;
      max-width: 100%;
      padding: 5px 12px;
      border-radius: 12px;
      background: rgba(10, 10, 16, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f2f2f7;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .zeile:empty { display: none; }
    .zeile.du { color: #d8d8e6; font-size: 12.5px; }
    .zeile.du::before { content: "🎙 "; }
    .zeile.antwort { border-color: rgba(255, 255, 255, 0.2); }
    .zeile.hinweis { color: #ffc15e; border-color: rgba(255, 181, 71, 0.45); }
  </style>
</head>
<body>
  <canvas id="leinwand"></canvas>
  <div id="untertitel" class="weg">
    <div class="zeile du" id="du"></div>
    <div class="zeile antwort" id="antwort"></div>
  </div>
  <script src="blase.js"></script>
</body>
</html>
