<!doctype html>
<html lang="de" data-theme="dunkel">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Julia</title>
  <link rel="stylesheet" href="basis.css">
  <link rel="stylesheet" href="einstellungen.css">
  <script src="design.js"></script>
</head>
<body>
  <header class="einst-kopf ziehbar">
    <span class="mini-kugel gross"></span>
    <div>
      <h1 data-t="einst.titel"></h1>
      <p class="version" id="version"></p>
    </div>
  </header>

  <div class="huelle">
    <section class="willkommen" id="willkommen" hidden>
      <h2 data-t="einst.einrichtung_titel"></h2>
      <p data-t="einst.einrichtung_text"></p>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.allgemein"></h2>
      <div class="zwei">
        <div class="feld">
          <label for="name" data-t="einst.name"></label>
          <input id="name" data-k="nutzer.name" type="text" autocomplete="off">
        </div>
        <div class="feld">
          <label for="sprachcode" data-t="einst.sprachcode"></label>
          <select id="sprachcode" data-k="sprachcode">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="assistentName" data-t="einst.assistent_name"></label>
          <input id="assistentName" data-k="assistent.name" type="text" maxlength="24" autocomplete="off" spellcheck="false">
        </div>
        <div class="feld">
          <label for="assistentForm" data-t="einst.assistent_form"></label>
          <select id="assistentForm" data-k="assistent.form">
            <option value="weiblich" data-t="einst.form_weiblich"></option>
            <option value="maennlich" data-t="einst.form_maennlich"></option>
            <option value="neutral" data-t="einst.form_neutral"></option>
          </select>
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="pronomen" data-t="einst.pronomen"></label>
          <select id="pronomen" data-k="nutzer.pronomen">
            <option value="er" data-t="einst.pronomen_er"></option>
            <option value="sie" data-t="einst.pronomen_sie"></option>
            <option value="neutral" data-t="einst.pronomen_neutral"></option>
            <option value="eigene" data-t="einst.pronomen_eigene"></option>
          </select>
        </div>
        <div class="feld" id="pronomenEigenFeld" hidden>
          <label for="pronomenEigen" data-t="einst.pronomen_eigen"></label>
          <input id="pronomenEigen" data-k="nutzer.pronomen_eigen" type="text" maxlength="30" placeholder="xier/xiem" autocomplete="off">
        </div>
      </div>
      <div class="feld">
        <label for="schluessel" data-t="einst.schluessel"></label>
        <input id="schluessel" type="password" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
        <small id="schluesselHinweis"></small>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="modell" data-t="einst.modell"></label>
          <input id="modell" data-k="modell" list="modelle" spellcheck="false">
          <datalist id="modelle">
            <option value="claude-opus-5">
            <option value="claude-fable-5-1">
            <option value="claude-sonnet-5">
            <option value="claude-haiku-4-5">
          </datalist>
        </div>
        <div class="feld">
          <label for="aufwand" data-t="einst.aufwand"></label>
          <select id="aufwand" data-k="aufwand">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
        </div>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="design.titel"></h2>
      <div class="feld">
        <label data-t="design.modus"></label>
        <div class="segment" id="modus">
          <button data-wert="dunkel" data-t="design.dunkel"></button>
          <button data-wert="hell" data-t="design.hell"></button>
          <button data-wert="system" data-t="design.system"></button>
        </div>
      </div>
      <div class="feld">
        <label data-t="design.akzent"></label>
        <div class="akzente" id="akzente"></div>
      </div>
      <label class="schalter"><input type="checkbox" data-k="design.glow"><span data-t="design.glow"></span></label>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.ordner"></h2>
      <p class="hinweis" data-t="einst.ordner_hinweis"></p>
      <ul class="ordner" id="ordnerListe"></ul>
      <button class="zweit" id="ordnerHinzu" data-t="einst.ordner_hinzu"></button>
    </section>

    <section class="gruppe">
      <h2 data-t="konten.titel"></h2>
      <p class="hinweis" data-t="konten.hinweis"></p>
      <div class="konto" id="kontoGoogle">
        <div class="konto-kopf">
          <span class="konto-logo">G</span>
          <div class="konto-name">
            <strong>Google</strong>
            <small id="googleStatus"></small>
          </div>
          <button class="zweit" id="googleTrennen" data-t="konten.trennen" hidden></button>
        </div>
        <div id="googleEinrichten" class="konto-einrichten">
          <p class="hinweis"><span data-t="konten.google_text"></span> <a id="googleAnleitung" target="_blank" rel="noreferrer" data-t="konten.anleitung"></a></p>
          <div class="zwei">
            <div class="feld">
              <label for="googleClientId" data-t="konten.client_id"></label>
              <input id="googleClientId" spellcheck="false" autocomplete="off" placeholder="…apps.googleusercontent.com">
            </div>
            <div class="feld">
              <label for="googleClientSecret" data-t="konten.client_secret"></label>
              <input id="googleClientSecret" type="password" spellcheck="false" autocomplete="off">
              <small id="googleSecretHinweis"></small>
            </div>
          </div>
          <button class="primaer klein" id="googleVerbinden" data-t="konten.verbinden"></button>
          <small class="konto-meldung" id="googleMeldung"></small>
        </div>
      </div>

      <div class="konto" id="kontoHandy">
        <div class="konto-kopf">
          <span class="konto-logo handy">✈</span>
          <div class="konto-name">
            <strong data-t="handy.titel"></strong>
            <small id="handyStatus"></small>
          </div>
          <button class="zweit" id="handyTrennen" data-t="konten.trennen" hidden></button>
        </div>
        <div id="handyEinrichten" class="konto-einrichten">
          <p class="hinweis"><span data-t="handy.text"></span> <a id="handyAnleitung" target="_blank" rel="noreferrer" data-t="konten.anleitung"></a></p>
          <div class="feld">
            <label for="handyToken" data-t="handy.token"></label>
            <input id="handyToken" type="password" placeholder="123456789:AA…" spellcheck="false" autocomplete="off">
          </div>
          <button class="primaer klein" id="handyVerbinden" data-t="handy.verbinden"></button>
          <small class="konto-meldung" id="handyMeldung"></small>
        </div>
        <div id="handyKoppeln" class="konto-einrichten" hidden>
          <p class="hinweis" data-t="handy.koppeln_text"></p>
          <div class="kopplungscode" id="handyCode"></div>
          <a class="zweit" id="handyLink" target="_blank" rel="noreferrer" data-t="handy.oeffnen"></a>
        </div>
        <div class="feld schmal" id="handyFreigabenFeld" hidden>
          <label for="handyFreigaben" data-t="handy.freigaben"></label>
          <select id="handyFreigaben" data-k="handy.freigaben">
            <option value="handy" data-t="handy.freigaben_handy"></option>
            <option value="pc" data-t="handy.freigaben_pc"></option>
          </select>
        </div>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.sprache"></h2>
      <div class="zwei">
        <div class="feld">
          <label for="hkSprechen" data-t="einst.hotkey_sprechen"></label>
          <input id="hkSprechen" data-k="hotkey.sprechen" spellcheck="false">
        </div>
        <div class="feld">
          <label for="hkChat" data-t="einst.hotkey_chat"></label>
          <input id="hkChat" data-k="hotkey.chat" spellcheck="false">
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="vorlesen" data-t="einst.vorlesen"></label>
          <select id="vorlesen" data-k="sprache.vorlesen">
            <option value="bei-sprache" data-t="einst.vorlesen_bei"></option>
            <option value="immer" data-t="einst.vorlesen_immer"></option>
            <option value="nie" data-t="einst.vorlesen_nie"></option>
          </select>
        </div>
        <div class="feld">
          <label for="stimme" data-t="einst.stimme"></label>
          <select id="stimme" data-k="sprache.stimme"></select>
        </div>
      </div>
      <div class="regler">
        <label for="sprechtempo" data-t="einst.sprechtempo"></label>
        <input type="range" id="sprechtempo" data-k="sprache.tempo" data-zahl min="-10" max="10" step="1">
        <output></output>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.blase"></h2>
      <label class="schalter"><input type="checkbox" data-k="blase.an"><span data-t="einst.blase_an"></span></label>
      <div class="zwei">
        <div class="feld">
          <label for="monitor" data-t="einst.monitor"></label>
          <select id="monitor" data-k="blase.monitor" data-zahl></select>
        </div>
        <div class="feld">
          <label for="ecke" data-t="einst.ecke"></label>
          <select id="ecke" data-k="blase.ecke">
            <option value="unten-rechts" data-t="ecke.unten-rechts"></option>
            <option value="unten-links" data-t="ecke.unten-links"></option>
            <option value="oben-rechts" data-t="ecke.oben-rechts"></option>
            <option value="oben-links" data-t="ecke.oben-links"></option>
          </select>
        </div>
      </div>
      <div class="regler">
        <label data-t="einst.groesse"></label>
        <input type="range" data-k="blase.groesse" data-zahl data-live min="120" max="900" step="10">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.deckkraft"></label>
        <input type="range" data-k="blase.deckkraft" data-zahl data-live min="0.1" max="1" step="0.05">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.tempo"></label>
        <input type="range" data-k="blase.tempo" data-zahl data-live min="0" max="3" step="0.1">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.empfindlichkeit"></label>
        <input type="range" data-k="blase.empfindlichkeit" data-zahl data-live min="0" max="3" step="0.1">
        <output></output>
      </div>
      <h3 data-t="einst.farben"></h3>
      <div class="farben" id="farben"></div>
      <div class="knopfreihe">
        <button class="zweit" id="standardfarben" data-t="einst.standardfarben"></button>
        <button class="zweit" id="blaseAkzent" data-t="design.blase_akzent"></button>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.overlay"></h2>
      <p class="hinweis" data-t="einst.overlay_hinweis"></p>
      <div class="zwei">
        <div class="feld">
          <label for="hkOverlay" data-t="einst.hotkey_overlay"></label>
          <input id="hkOverlay" data-k="hotkey.overlay" spellcheck="false" placeholder="Control+Shift+Space">
        </div>
        <div class="feld">
          <label for="overlayAntwort" data-t="einst.overlay_bei_antwort"></label>
          <select id="overlayAntwort" data-k="overlay.bei_antwort">
            <option value="aus" data-t="einst.overlay_aus"></option>
            <option value="passiv" data-t="einst.overlay_passiv"></option>
          </select>
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="overlayMonitor" data-t="einst.monitor"></label>
          <select id="overlayMonitor" data-k="overlay.monitor" data-zahl></select>
        </div>
        <div class="feld">
          <label for="overlayEcke" data-t="einst.ecke"></label>
          <select id="overlayEcke" data-k="overlay.ecke">
            <option value="oben-rechts" data-t="ecke.oben-rechts"></option>
            <option value="oben-links" data-t="ecke.oben-links"></option>
            <option value="unten-rechts" data-t="ecke.unten-rechts"></option>
            <option value="unten-links" data-t="ecke.unten-links"></option>
          </select>
        </div>
      </div>
      <div class="regler">
        <label data-t="einst.overlay_deckkraft"></label>
        <input type="range" data-k="overlay.deckkraft" data-zahl data-live min="0.3" max="1" step="0.02">
        <output></output>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.system"></h2>
      <label class="schalter"><input type="checkbox" data-k="erinnerung.vorlesen"><span data-t="einst.erinnerung_vorlesen"></span></label>
      <label class="schalter"><input type="checkbox" data-k="erinnerung.handy"><span data-t="einst.erinnerung_handy"></span></label>
      <label class="schalter"><input type="checkbox" data-k="autostart"><span data-t="einst.autostart"></span></label>
      <label class="schalter"><input type="checkbox" data-k="update.pruefen"><span data-t="einst.update_pruefen"></span></label>
      <label class="schalter"><input type="checkbox" data-k="update.automatisch"><span data-t="einst.update_auto"></span></label>
      <div class="feld schmal">
        <label for="kanal" data-t="einst.update_kanal"></label>
        <select id="kanal" data-k="update.kanal">
          <option value="stabil" data-t="einst.kanal_stabil"></option>
          <option value="test" data-t="einst.kanal_test"></option>
        </select>
      </div>
    </section>
  </div>

  <footer class="einst-fuss">
    <span id="meldung"></span>
    <button class="primaer" id="speichern"></button>
  </footer>

  <script src="einstellungen.js"></script>
</body>
</html>
