name: Rust-Kern testen

# Baut und testet den nativen Kern-Anfang julia-core (Issue #65). Läuft nur, wenn
# sich am Kern etwas ändert. GitHub-Runner haben Rust/cargo bereits vorinstalliert,
# daher braucht es keine zusätzliche Toolchain-Action.

on:
  push:
    paths:
      - 'julia-core/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    paths:
      - 'julia-core/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: julia-core
    steps:
      - name: Quellcode holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust-Version zeigen
        run: cargo --version && rustc --version && cargo clippy --version

      - name: Clippy (Lints und Optimierungen, Warnungen sind Fehler)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all --verbose

  # Baut das Sidecar-Binary für Windows (Zielplattform der Desktop-App) und lädt
  # es als Artefakt hoch. Das ist die Voraussetzung, um den Kern später mit der
  # App auszuliefern; das Einbetten in den Installer folgt als eigener Schritt.
  windows-binary:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: julia-core
    steps:
      - name: Quellcode holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Release-Binary bauen
        run: cargo build --release --bin cli

      - name: Sidecar-Binary als Artefakt anhängen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: julia-core-sidecar-windows
          path: julia-core/target/release/cli.exe
