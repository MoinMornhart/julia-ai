<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Julia – your AI for the Windows PC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="1" stop-color="#141019"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="0.5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ff3da5"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9b0"/>
    </linearGradient>
    <style>
      .t { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="235" cy="150" r="180" fill="url(#glow)"/>

  <circle cx="235" cy="150" r="72" fill="url(#orb)"/>
  <circle cx="235" cy="150" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <ellipse cx="210" cy="122" rx="30" ry="20" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="235" cy="150" r="98" fill="none" stroke="#ff7a1a" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="380" y="150" class="t" font-size="104" font-weight="800" fill="url(#title)">Julia</text>
  <text x="386" y="196" class="t" font-size="27" font-weight="600" fill="#c8c8d6">Your AI for the Windows PC</text>

  <g class="t" font-size="17" font-weight="600" fill="#ffd9b0">
    <rect x="386" y="222" width="182" height="34" rx="17" fill="#ff7a1a" fill-opacity="0.14" stroke="#ff7a1a" stroke-opacity="0.4"/>
    <text x="406" y="244">Sees &amp; controls</text>
    <rect x="580" y="222" width="160" height="34" rx="17" fill="#ff7a1a" fill-opacity="0.14" stroke="#ff7a1a" stroke-opacity="0.4"/>
    <text x="600" y="244">Speaks locally</text>
    <rect x="752" y="222" width="176" height="34" rx="17" fill="#ff7a1a" fill-opacity="0.14" stroke="#ff7a1a" stroke-opacity="0.4"/>
    <text x="772" y="244">Plays Minecraft</text>
    <rect x="940" y="222" width="150" height="34" rx="17" fill="#ff7a1a" fill-opacity="0.14" stroke="#ff7a1a" stroke-opacity="0.4"/>
    <text x="960" y="244">Asks first</text>
  </g>
</svg>
